<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TruthLens</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #0d1027;
      color: #e8eaf3;
      font-size: 13px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .header h1 { font-size: 14px; font-weight: 700; letter-spacing: 0.04em; }
    .header .sub { font-size: 11px; color: #9aa1c2; }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      padding: 12px 16px;
    }
    .stat-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 10px;
      padding: 10px 8px;
      text-align: center;
    }
    .stat-card .num {
      font-size: 22px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .stat-card .lbl {
      font-size: 10px;
      color: #9aa1c2;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-top: 4px;
    }
    .stat-card.real .num { color: #5fd28a; }
    .stat-card.ai .num   { color: #ff5577; }
    .stat-card.inc .num  { color: #ffb547; }

    .total-row {
      padding: 0 16px 12px;
      font-size: 12px;
      color: #9aa1c2;
      text-align: center;
    }

    .divider { border: none; border-top: 1px solid rgba(255,255,255,0.07); }

    .section {
      padding: 12px 16px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .toggle-label { font-size: 12px; color: #c8cce0; }
    .toggle-sub { font-size: 11px; color: #9aa1c2; margin-top: 2px; }

    /* Toggle switch */
    .switch { position: relative; display: inline-block; width: 38px; height: 22px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: #272c52;
      border-radius: 22px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .slider::before {
      content: "";
      position: absolute;
      width: 16px; height: 16px;
      left: 3px; bottom: 3px;
      background: #e8eaf3;
      border-radius: 50%;
      transition: transform 0.2s;
    }
    input:checked + .slider { background: #3ec5ff; }
    input:checked + .slider::before { transform: translateX(16px); }

    .settings-section {
      padding: 12px 16px 4px;
    }
    .settings-section label {
      display: block;
      font-size: 11px;
      color: #9aa1c2;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 4px;
    }
    input[type="url"] {
      width: 100%;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid #272c52;
      background: #191c39;
      color: #e8eaf3;
      font-size: 12px;
    }
    input[type="url"]:focus { outline: none; border-color: #3ec5ff; }

    .btn {
      display: block;
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 0;
      background: #3ec5ff;
      color: #0d1027;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }
    .btn:hover { background: #6dd5ff; }
    .btn-ghost {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.12);
      color: #9aa1c2;
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.05); }

    .save-row {
      padding: 8px 16px 14px;
      display: flex;
      gap: 8px;
    }
    .saved-msg { font-size: 11px; color: #5fd28a; min-height: 14px; text-align: center; padding: 0 16px 10px; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>TruthLens</h1>
      <div class="sub" id="site-label">Loading…</div>
    </div>
  </div>

  <!-- Per-tab stats -->
  <div class="stats">
    <div class="stat-card real">
      <div class="num" id="count-real">—</div>
      <div class="lbl">Real</div>
    </div>
    <div class="stat-card ai">
      <div class="num" id="count-ai">—</div>
      <div class="lbl">AI</div>
    </div>
    <div class="stat-card inc">
      <div class="num" id="count-inc">—</div>
      <div class="lbl">Unclear</div>
    </div>
  </div>
  <div class="total-row" id="total-row">No images analysed yet on this tab.</div>

  <hr class="divider">

  <!-- Pause toggle -->
  <div class="section">
    <div class="toggle-row">
      <div>
        <div class="toggle-label">Pause on this site</div>
        <div class="toggle-sub" id="pause-sub">Badges hidden while paused</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="pause-toggle">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <hr class="divider">

  <!-- Backend URL setting -->
  <div class="settings-section">
    <label for="api-url">Backend URL</label>
    <input type="url" id="api-url" placeholder="http://127.0.0.1:8000">
  </div>
  <div class="save-row">
    <button class="btn" id="save-btn">Save</button>
  </div>
  <div class="saved-msg" id="saved-msg"></div>

  <script src="popup.js"></script>
</body>
</html>
