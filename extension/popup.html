<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TruthLens settings</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
      background: #0d1027;
      color: #e8eaf3;
      font-size: 13px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 14px;
      letter-spacing: 0.04em;
    }
    p { color: #9aa1c2; margin: 0 0 12px; font-size: 12px; }
    label { display: block; margin-top: 8px; color: #9aa1c2; font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      margin-top: 4px;
      border-radius: 8px;
      border: 1px solid #272c52;
      background: #191c39;
      color: #e8eaf3;
      font-size: 13px;
    }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 9px;
      border-radius: 8px;
      border: 0;
      background: #3ec5ff;
      color: #0d1027;
      font-weight: 600;
      cursor: pointer;
    }
    .ok { color: #5fd28a; font-size: 12px; margin-top: 8px; min-height: 16px; }
  </style>
</head>
<body>
  <h1>TruthLens</h1>
  <p>Right-click any image, video, or audio on a page to analyse it.</p>
  <label for="api">Backend URL</label>
  <input id="api" type="url" placeholder="http://127.0.0.1:8000" />
  <button id="save">Save</button>
  <div id="status" class="ok"></div>
  <script src="popup.js"></script>
</body>
</html>
